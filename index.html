<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <header>
        <h1>Blog</h1>
    </header>
    <main>
        <section id="findPost">

            <label>Search Post
                <input type="text" name = "searchPost" id="searchPost">

            </label>
            
            <label>Search tags
                <input type="text" name="searchTags" id="searchTags">
            </label>
            
            
            <label for="sortPosts">Sort posts</label>
            <select name="sortPosts" id="sortPosts">
                <option value="default">First added</option>
                <option value="sortByViews">Most viewed</option>
                <option value="sortByLikes">Most Liked</option>
            </select>
        </section>

        <p id="message"></p>
        <p><span id="postCount"></span> posts</p>
        <section id="catalog">
        
        </section>
    </main>

    <footer>
        <p>Michael ~ 2026</p>
    </footer>
</body>
</html>
